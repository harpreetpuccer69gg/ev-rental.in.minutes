<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Swap Stations – EV Assist</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;overflow:hidden}

/* HEADER */
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header img{height:28px;border-radius:6px}
.header h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.header .back-link{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;white-space:nowrap}

/* FILTERS BAR */
.filters{background:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #e8eaed;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filter-select{padding:7px 10px;border:1.5px solid #e0e0e0;border-radius:20px;font-size:13px;background:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;color:#1a1a2e;font-weight:500}
.filter-select:focus{outline:none;border-color:#4CAF50}
.count-pill{background:#e8f5e9;color:#2e7d32;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}

/* MAP */
#map{height:calc(100vh - 108px);width:100%}

/* LOCATION BUTTON */
.loc-btn{position:absolute;bottom:100px;right:12px;z-index:1000;width:46px;height:46px;background:#fff;border:none;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .15s}
.loc-btn:active{transform:scale(.92)}
.loc-btn.loading{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LEGEND */
.legend{position:absolute;bottom:160px;left:12px;z-index:1000;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:12px}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-weight:500}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}

/* POPUP */
.popup-box{min-width:210px;font-family:'Segoe UI',sans-serif}
.popup-box h3{font-size:14px;font-weight:700;margin-bottom:5px;color:#1a1a2e;line-height:1.3}
.popup-box .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:8px}
.popup-box p{font-size:12px;color:#666;margin-bottom:3px}
.dir-btn{display:block;width:100%;padding:9px;background:linear-gradient(135deg,#4CAF50,#388e3c);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:8px;letter-spacing:.3px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* NEARBY BADGE */
.nearby-badge{background:#fff3e0;color:#e65100;border:1.5px solid #ffcc80;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;display:none}

@media(max-width:480px){
  .header h1{font-size:14px}
  #map{height:calc(100vh - 104px)}
}
</style>
</head>
<body>

<div class="header">
  <img src="/static/images/logo.png" alt="EV" onerror="this.style.display='none'"/>
  <h1>⚡ Battery Swap Stations</h1>
  <a href="/" class="back-link">← Back</a>
</div>

<div class="filters">
  <select class="filter-select" id="vendor-filter">
    <option value="">All Networks</option>
    <option value="Indofast">Indofast</option>
    <option value="Yuma">Yuma (Yulu)</option>
    <option value="Battery Smart">Battery Smart</option>
    <option value="EMO">EMO</option>
  </select>
  <select class="filter-select" id="city-filter">
    <option value="">All Cities</option>
  </select>
  <span class="count-pill" id="count-badge">Loading...</span>
  <span class="nearby-badge" id="nearby-badge">📍 Near You</span>
</div>

<div id="map"></div>

<button class="loc-btn" id="locBtn" title="Find my location" onclick="findMyLocation()">📍</button>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e65100"></div>Indofast</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div>Yuma</div>
  <div class="legend-item"><div class="legend-dot" style="background:#6a1b9a"></div>Battery Smart</div>
  <div class="legend-item"><div class="legend-dot" style="background:#2e7d32"></div>EMO</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── VENDOR COLORS ──────────────────────────────────────────────
const COLORS = {
  'Indofast':      '#e65100',
  'Yuma':          '#1565c0',
  'Battery Smart': '#6a1b9a',
  'EMO':           '#2e7d32'
};

function makeIcon(vendor, highlight) {
  const c = COLORS[vendor] || '#555';
  const size = highlight ? 28 : 22;
  const r    = highlight ? 38 : 30;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${r}" viewBox="0 0 ${size} ${r}">
    <path d="M${size/2} 0C${size/2-6.1} 0 0 ${size/2-5.1} 0 ${size/2}c0 ${r-size/2-2} ${size/2} ${r-size/2+2} ${size/2} ${r-size/2+2}s${size/2}-${r-size/2} ${size/2}-${r-size/2+2}C${size} ${size/2-5.1} ${size/2+6.1} 0 ${size/2} 0z" fill="${c}" ${highlight?'stroke="#fff" stroke-width="2"':''}/>
    <circle cx="${size/2}" cy="${size/2}" r="${size/2-5}" fill="#fff"/>
    <text x="${size/2}" y="${size/2+4}" text-anchor="middle" font-size="${size/2-3}" fill="${c}" font-weight="bold">⚡</text>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize:   [size, r],
    iconAnchor: [size/2, r],
    popupAnchor:[0, -r]
  });
}

// ── CITY CENTERS ───────────────────────────────────────────────
const CITY_CENTERS = {
  'Bangalore':  [12.97, 77.59],
  'Delhi NCR':  [28.62, 77.21],
  'Hyderabad':  [17.44, 78.44],
  'Mumbai':     [19.08, 72.88],
  'Pune':       [18.52, 73.86],
  'Chennai':    [13.04, 80.24],
  'Kolkata':    [22.57, 88.36],
  'Jaipur':     [26.91, 75.79],
  'Chandigarh': [30.73, 76.78],
  'Kochi':      [9.93,  76.27],
  'Noida':      [28.54, 77.39],
  'Gurugram':   [28.46, 77.03],
  'Agra':       [27.18, 78.01],
  'Vijayawada': [16.51, 80.63],
  'Sonipat':    [28.99, 77.02]
};

// ── CITY DETECTION ─────────────────────────────────────────────
function detectCity(area) {
  const a = area.toLowerCase();
  const checks = [
    ['Bangalore', ['koramangala','hsr','whitefield','yelahanka','peenya','btm','bannerghata','marathalli','hoodi','thanisandra','yeshwanthpur','domlur','jayanagar','rajajinagar','kalkere','electronics city','bommanahalli','belathur','varthur','chikkabellandur','nagasandra','padmanabhanagar','seshadripuram','sanjay nagar','banaswadi','frazer town','cox town','kalyan nagar','rr nagar','mallathalli','gottigere','banashankari','uttarahalli','kanakapura','jigani','bommasandra','doddanekkundi','anand nagar','nagavara','budigere','devanahalli','bagalur','akshaya nagar','mailsandra','hosa road','singasandra','e-city','gopalan mall','mahadevapura','kr puram','kodigehalli','nagarbhavi','heganahalli','azad nagar','adugodi','doddanagamangala','sompura','dommasandra','manipal county','jp nagar','indiranagar','hebbal']],
    ['Delhi NCR', ['rohini','dwarka','janakpuri','hari nagar','paschim vihar','pitampura','moti nagar','karol bagh','tis hazari','connaught','vasant vihar','vasant kunj','sarita vihar','laxmi nagar','geeta colony','jhilmil','mandoli','brij puri','jahangirpuri','shalimar bagh','burari','narela','shahbad','uttam nagar','vikaspuri','nangloi','palam','dabri','najafgarh','chattarpur','malviya nagar','lado sarai','madangir','south ex','south patel','rajendra place','motia khan','naraina','rajauri','punjabi bagh','azadpur','kamla nagar','welcome','khichripur','gharoli','vinod nagar','jasola','gk1','zamrudpur','greater kailash','santnagar','vaishali','nehru nagar','lohia nagar','chandar nagar','vasundhara','rani bagh','nyay khand']],
    ['Gurugram', ['kapashera','gurugram','ggn','gurgaon','sushant lok','dlf','sec-37','sec10a','wazirabad','kherki','rampura','sector 52','sector 46','sector 41','sector 43','sector 49','sector 55','sector 65','sector 68','sector 71','sector 72','iffco','mg road','huda city','samaspur','faridabad','ballabgarh','nit5','sec-16 faridabad','sec-14 gurugram','sec-23, gurugram','ashok vihar']],
    ['Noida', ['noida','ekmurt','gaur city','sec-10 noida','sec-63','wazidpur','zeta','gr noida','knowledge park','kowledge park','sec-150','sec-2 greater','noida ace','sec-141','sec-128','sec-104','sec-44','sec-58','sec-52','sec-18','sec-116','sec-122','nyay khand','sec-2 greater noida']],
    ['Hyderabad', ['mallapur','yapral','new bowenpally','sanath nagar','tarnaka','malkajgiri','neredmet','hitec city','madhapur','nanakramguda','serilingampalle','tellapur','miyapur','bachupally','kompally','quthbullapur','bolarum','old alwal','paradise','banjara hills','borabanda','king koti','hyderguda','yosufguda','gudimalkapur','moghalpura','chandrayangutta','vanasthalipuram','kothapet','nagole','santosh nagar','arunodaya','dollar hills','kantha reddy','pjr layout','mayuri nagar','hanamkonda','kashibugga','gachibowli','kondapur','ameerpet','punjagutta','jntu','nallagandla','allwyn','venkata ramana','chanda nagar','pragati nagar','chintal','balkampet','bhavani nagar','kothaguda']],
    ['Mumbai', ['wadala','govandi','powai','khar','goregaon','malad','borivali','dahisar','andheri','sakinaka','kurla','sion','mahim','sewri','marine lines','kandivali','akurli','mulund','thane','kanjurmarg']],
    ['Pune', ['vimanagar','amanora','pimple gurav','rahatani','bundgarden','bhawani peth','katraj','kondhwa','hadapsar','kharadi','wagholi','wakad','hinjewadi','balewadi','baner','aundh','warje','mukung','lohegaon','moshi','bhosari','ravet']],
    ['Chennai', ['royapettah','adyar','perungudi','velachery','pallikaranai','madipakkam','saidapet','west mambalam','mugapair','alapakkam','ramapuram','virugambakkam','annanur','egmore','george town','aminjikarai','shenoy nagar','padi','madhavaram','chitlapakkam','selaiyur','nagalkeni','chrompet','thoriapakkam','noothenchery']],
    ['Kolkata', ['newtown','mahishbathan']],
    ['Kochi', ['palluruthy','eroor','elamakkara','puthiyara','poojapura','kulathoor','kuravankonam','chevayoor']],
    ['Jaipur', ['adarsh nagar','22 godown','subhash nagar','amer road','riddhi siddhi','jhotwara','vidhyadhar','vaishali nagar','kalyanpura','malviya nagar (bts)','nirman nagar','chitrakoot','govindpura','jagatpura','paladi meena','rangoli garden']],
    ['Chandigarh', ['vip road','peer muchalla','industrial area 1','phase 7','panchkula','sector 9','phase 2, sector 54']],
    ['Sonipat', ['sonipat']],
    ['Agra', ['tajganj','rambagh','awas vikas','shahganj']],
    ['Vijayawada', ['auto nagar','governorpet','bhavanipuram']]
  ];
  for (const [city, keywords] of checks) {
    if (keywords.some(k => a.includes(k))) return city;
  }
  return 'Other';
}

// ── MAP INIT ───────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 5);

// Modern clean map tiles (CartoDB Positron)
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Zoom control bottom-right
L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── STATE ──────────────────────────────────────────────────────
let allStations = [];
let markers     = [];
let citySet     = new Set();
let userMarker  = null;
let userAccCircle = null;
let userLat = null;
let userLng = null;
let nearbyMode  = false;

// ── TOAST ──────────────────────────────────────────────────────
function showToast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── HAVERSINE DISTANCE (km) ────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
}

// ── RENDER MARKERS ─────────────────────────────────────────────
function renderMarkers(stations) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  stations.forEach(s => {
    const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.vendor, false) });
    const tagColor = COLORS[s.vendor] || '#555';
    const fromYou  = (userLat !== null)
      ? `<p>📍 <b>${haversine(userLat, userLng, s.lat, s.lng)} km</b> from you</p>`
      : '';
    const distText = s.dist_km ? `<p>🏪 ${s.dist_km} km from dark store</p>` : '';
    m.bindPopup(`
      <div class="popup-box">
        <h3>${s.area}</h3>
        <span class="tag" style="background:${tagColor}22;color:${tagColor};border:1px solid ${tagColor}44">${s.vendor}</span>
        ${fromYou}
        ${distText}
        <a class="dir-btn"
           href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}"
           target="_blank">🗺️ Get Directions</a>
      </div>
    `, { maxWidth: 250 });
    m.addTo(map);
    markers.push(m);
  });
  document.getElementById('count-badge').textContent = `${stations.length} stations`;
}

// ── FILTERS ────────────────────────────────────────────────────
function applyFilters() {
  nearbyMode = false;
  document.getElementById('nearby-badge').style.display = 'none';
  const vendor = document.getElementById('vendor-filter').value;
  const city   = document.getElementById('city-filter').value;
  let filtered = allStations;
  if (vendor) filtered = filtered.filter(s => s.vendor === vendor);
  if (city)   filtered = filtered.filter(s => s.city === city);
  renderMarkers(filtered);
  if (city && CITY_CENTERS[city]) {
    map.setView(CITY_CENTERS[city], 12);
  } else if (!city && !vendor) {
    map.setView([20.5937, 78.9629], 5);
  }
}

// ── CURRENT LOCATION ───────────────────────────────────────────
function findMyLocation() {
  const btn = document.getElementById('locBtn');
  if (!navigator.geolocation) {
    showToast('Location not supported on this device');
    return;
  }
  btn.textContent = '🔄';
  btn.classList.add('loading');
  showToast('Finding your location...', 3000);

  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.textContent = '📍';
      btn.classList.remove('loading');

      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      // Remove old user layers
      if (userMarker)    map.removeLayer(userMarker);
      if (userAccCircle) map.removeLayer(userAccCircle);

      // Accuracy circle (light blue, like Google Maps)
      userAccCircle = L.circle([userLat, userLng], {
        radius: acc,
        color: '#1a73e8',
        fillColor: '#1a73e8',
        fillOpacity: 0.12,
        weight: 1.5
      }).addTo(map);

      // Persistent blue dot — stays on top of all markers
      userMarker = L.circleMarker([userLat, userLng], {
        radius: 10,
        fillColor: '#1a73e8',
        color: '#fff',
        weight: 3,
        fillOpacity: 1,
        pane: 'markerPane'
      }).addTo(map).bindPopup(`<b>📍 You are here</b><br><span style="font-size:11px;color:#888">Accuracy: ±${Math.round(acc)}m</span>`);

      // Find nearest 30 stations using real haversine distance
      const vendor = document.getElementById('vendor-filter').value;
      let pool = allStations;
      if (vendor) pool = pool.filter(s => s.vendor === vendor);

      const withDist = pool.map(s => ({
        ...s,
        _d: haversine(userLat, userLng, s.lat, s.lng)
      })).sort((a, b) => a._d - b._d).slice(0, 30);

      renderMarkers(withDist);
      // Re-add user layers on top after renderMarkers clears markers array
      userAccCircle.addTo(map);
      userMarker.addTo(map);
      nearbyMode = true;
      document.getElementById('nearby-badge').style.display = 'inline-block';
      map.setView([userLat, userLng], 14);
      showToast(`Showing ${withDist.length} nearest stations`);
    },
    err => {
      btn.textContent = '📍';
      btn.classList.remove('loading');
      const msgs = {1:'Location permission denied', 2:'Location unavailable', 3:'Location request timed out'};
      showToast(msgs[err.code] || 'Could not get location');
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

// ── LOAD DATA ──────────────────────────────────────────────────
fetch('/swap-stations')
  .then(r => r.json())
  .then(data => {
    allStations = data.map(s => ({ ...s, city: detectCity(s.area) }));

    // Build city dropdown
    allStations.forEach(s => citySet.add(s.city));
    const citySelect = document.getElementById('city-filter');
    [...citySet].sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      citySelect.appendChild(opt);
    });

    // Auto-apply URL params
    const params  = new URLSearchParams(window.location.search);
    const pVendor = params.get('vendor') || '';
    const pCity   = params.get('city')   || '';
    if (pVendor) document.getElementById('vendor-filter').value = pVendor;
    if (pCity)   document.getElementById('city-filter').value   = pCity;

    renderMarkers(allStations);
    if (pVendor || pCity) applyFilters();

    document.getElementById('vendor-filter').addEventListener('change', applyFilters);
    document.getElementById('city-filter').addEventListener('change', applyFilters);
  })
  .catch(() => {
    document.getElementById('count-badge').textContent = 'Error loading';
    showToast('Failed to load stations');
  });
</script>
</body>
</html>
